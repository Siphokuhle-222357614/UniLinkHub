<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniLinkHub · Connect. Buy. Sell & Succeed.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash svg {
        animation: splash-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #app-splash .splash-word {
        margin-top: 6px;
        font-family: "Poppins", system-ui, sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.01em;
        opacity: 0;
        animation: splash-fade-up 0.5s ease 0.15s both;
      }
      #app-splash .splash-tagline {
        margin-top: 10px;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.2em;
        color: #163d72;
        opacity: 0;
        animation: splash-fade-up 0.5s ease 0.3s both;
      }
      #app-splash .splash-bar {
        margin-top: 18px;
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: #d9e1ea;
        overflow: hidden;
      }
      #app-splash .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #163d72, #2a9bb4);
        border-radius: 999px;
        animation: splash-bar-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-pop {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes splash-bar-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
    </style>
  </head>
  <body class="bg-soft-grey text-charcoal font-sans antialiased">
    <div id="app-splash">
      <svg width="80" height="69" viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <text x="8" y="140" font-family="'Playfair Display', Georgia, serif" font-size="140" font-weight="700" fill="#163D72">U</text>
        <text x="100" y="140" font-family="'Playfair Display', Georgia, serif" font-size="140" font-weight="700" fill="#2A9BB4">H</text>
        <path d="M14 95 C 60 145, 150 145, 196 95" stroke="#2A9BB4" stroke-width="4" fill="none" stroke-linecap="round" />
        <g transform="translate(76, 106)">
          <path d="M31 0 L54 10 L31 20 L8 10 Z" fill="#B89A5E" />
          <path d="M31 20 v9" stroke="#B89A5E" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="31" cy="31" r="2.5" fill="#B89A5E" />
          <path d="M14 22 h4 l4 20 h20 l5 -14 h-25" stroke="#B89A5E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="24" cy="48" r="2.8" fill="#B89A5E" />
          <circle cx="38" cy="48" r="2.8" fill="#B89A5E" />
        </g>
      </svg>
      <p class="splash-word">
        <span style="color: #163d72">Uni</span><span style="color: #2a9bb4">Link</span><span style="color: #79c7e8">Hub</span>
      </p>
      <p class="splash-tagline">CONNECT. BUY. SELL &amp; SUCCEED</p>
      <div class="splash-bar"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

spring:
  datasource:
    url: jdbc:h2:mem:unilinkhub-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

unilinkhub:
  security:
    jwt:
      secret: test-secret-key-for-unit-and-integration-tests-only-32bytes
      expiration-ms: 3600000
